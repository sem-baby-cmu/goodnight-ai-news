<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten-page interactive picture book for young children about the many electronic helpers a future fusion machine may need.">
<title>Pip and the Tiny Power Helpers</title>
<style>
:root{--ink:#4a3023;--cream:#fff1d2;--teal:#087d74;--dark:#07564f;--gold:#ffc43c;--chrome:#173630e8}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;color:var(--ink);background:radial-gradient(circle at 50% 26%,#5c8177,#254d46 55%,#102f2b);font-family:"Avenir Next",Avenir,"Trebuchet MS",system-ui,sans-serif}
button{font:inherit}.reader{position:fixed;inset:0;display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.book{position:relative;width:min(100vw,150svh);height:min(100svh,66.6667vw);overflow:hidden;background:var(--cream);box-shadow:0 24px 90px #0008;isolation:isolate}
.page{position:absolute;inset:0;visibility:hidden;opacity:0;transform:translateX(2%);transition:opacity .28s,transform .28s,visibility 0s .28s}.page.active{visibility:visible;opacity:1;transform:none;transition-delay:0s}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.copy{position:absolute;z-index:8;left:7%;right:7%;top:76%;bottom:2%;display:grid;place-content:center;text-align:center;pointer-events:none}.copy h2{margin:0 0 .22em;color:var(--dark);font-family:Georgia,serif;font-size:clamp(.82rem,2.1vw,2.12rem);line-height:1.05}.copy p{max-width:980px;margin:0 auto;font-size:clamp(.55rem,1.22vw,1.22rem);font-weight:700;line-height:1.36;text-wrap:balance}
.ambient{position:absolute;z-index:4;pointer-events:none;width:1.2%;aspect-ratio:1;border-radius:50%;background:#fff9;box-shadow:0 0 14px #fff9}.ambient.a{left:16%;top:17%;animation:blink 2.5s steps(4,end) infinite}.ambient.b{left:55%;top:14%;animation:sway 1.9s steps(4,end) infinite}.ambient.c{left:84%;top:41%;animation:pulse 2.2s steps(4,end) infinite}
@keyframes blink{0%,70%,100%{opacity:0}78%,90%{opacity:1}}@keyframes sway{50%{transform:translateX(8px) rotate(9deg)}}@keyframes pulse{50%{transform:scale(1.65);opacity:.24}}
.hotspot{position:absolute;z-index:6;left:var(--x);top:var(--y);width:var(--w);height:var(--h);padding:0;border:0;border-radius:45%;color:transparent;background:transparent;cursor:pointer}.hotspot:after{content:"";position:absolute;inset:8%;border:3px dashed transparent;border-radius:48%}.show-hints .hotspot:after,.hotspot:focus-visible:after{border-color:#ffffffe8;background:#ffc43b22;box-shadow:0 0 0 4px #07554e33;animation:hint 1.25s steps(4,end) infinite}@keyframes hint{50%{transform:scale(1.07)}}
.burst{position:absolute;z-index:7;left:50%;top:50%;width:10%;aspect-ratio:1;opacity:0;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 0 6px #fff)}.burst:before,.burst:after{content:"";position:absolute;inset:10%;border-radius:50%;border:9px dotted #ffd44e}.burst:after{inset:32%;border-width:6px;border-color:#fff5c4}.burst.play{animation:burst .85s steps(6,end)}.burst.wave:before{border-style:solid}.burst.bob:before{border-radius:35%;border-style:dashed}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.18) rotate(0)}28%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.75) rotate(38deg)}}
.toast{position:absolute;z-index:18;left:50%;bottom:26%;max-width:74%;padding:.58em .95em;border:1px solid #ffffff88;border-radius:999px;color:#fff;background:#143f39e8;box-shadow:0 8px 26px #0004;font-size:clamp(.55rem,1.02vw,.95rem);font-weight:800;text-align:center;opacity:0;transform:translate(-50%,8px);pointer-events:none}.toast.show{animation:toast 1.7s steps(5,end)}@keyframes toast{0%{opacity:0}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.topbar,.nav{position:absolute;z-index:20;left:2.2%;right:2.2%;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.topbar{top:2.2%}.nav{bottom:2.2%}.tools,.dots{display:flex;gap:clamp(3px,.55vw,9px);pointer-events:auto}
.pill,.icon,.arrow{border:1px solid #ffffff66;color:#fff;background:var(--chrome);box-shadow:0 5px 18px #0003;backdrop-filter:blur(8px)}.pill{padding:.48em .85em;border-radius:999px;font-size:clamp(.55rem,1.02vw,.94rem);font-weight:850}.icon,.arrow{display:grid;place-items:center;padding:0;border-radius:50%;cursor:pointer}.icon{width:clamp(31px,3.2vw,45px);aspect-ratio:1;font-weight:900}.icon[aria-pressed=true]{color:#173e39;background:var(--gold)}.arrow{width:clamp(35px,4.1vw,59px);aspect-ratio:1;font-size:clamp(.95rem,1.85vw,1.5rem);pointer-events:auto}.arrow:disabled{opacity:.28;cursor:default}
.dot{width:clamp(5px,.7vw,10px);aspect-ratio:1;padding:0;border:0;border-radius:50%;background:#3b281f55;cursor:pointer}.dot.active{background:var(--teal);transform:scale(1.35)}
.notes{position:absolute;z-index:30;top:9%;right:2.2%;width:min(40%,540px);max-height:64%;overflow:auto;padding:clamp(.8rem,2vw,1.4rem);border:1px solid #ffffff66;border-radius:22px;color:#fff;background:#13342ff3;box-shadow:0 18px 50px #0005;transform:translateX(116%);transition:transform .22s}.notes.open{transform:none}.notes h3{margin:0 0 .45rem;font-size:clamp(.8rem,1.6vw,1.25rem)}.notes p,.notes li{font-size:clamp(.6rem,1.05vw,.92rem);line-height:1.42}.notes p{margin:.4rem 0}.notes ul{margin:.35rem 0 0;padding-left:1.15rem}.notes strong{color:#ffd66e}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-aspect-ratio:1/1){.notes{width:70%;top:12%}.copy{padding-inline:4%}.copy p{line-height:1.25}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="reader" aria-label="Pip and the Tiny Power Helpers interactive storybook"><section class="book" id="book">
  <div class="topbar"><div class="pill" id="label">Page 1 of 10</div><div class="tools"><button class="icon" id="hints" aria-pressed="false" aria-label="Show clickable spots">✦</button><button class="icon" id="sound" aria-pressed="true" aria-label="Turn sounds off">♪</button><button class="icon" id="info" aria-pressed="false" aria-label="Open story notes">i</button></div></div>
  <div id="pages"></div><aside class="notes" id="notes" aria-live="polite"></aside>
  <nav class="nav" aria-label="Story pages"><button class="arrow" id="prev" aria-label="Previous page">‹</button><div class="dots" id="dots"></div><button class="arrow" id="next" aria-label="Next page">›</button></nav>
  <p class="sr" id="live" aria-live="polite"></p>
</section></main>
<script>
const story=[
{title:"The Sun’s Bright Secret",text:"Inside the Sun, tiny pieces join together. This is called fusion, and it releases lots of energy.",note:"Fusion powers the Sun. The tabletop model is symbolic, not a working reactor.",spots:[[67,3,27,28,"glow","The Sun glows with fusion energy."],[39,27,27,34,"wave","Two tiny dots join in the model."],[69,28,22,34,"bob","Fenn points to the model."]]},
{title:"Fusion on Earth?",text:"Scientists are trying to make controlled fusion on Earth. It is a very hard job.",note:"Scientists are still working toward practical fusion power; this page shows a museum model.",spots:[[0,31,16,35,"bob","The safety gate opens."],[42,8,50,47,"wave","The ring is a research model."],[18,38,22,31,"glow","Dot looks up in wonder."]]},
{title:"A Machine Needs a Team",text:"A fusion machine needs many helpers—not just the hot center.",note:"Magnets, cooling, sensors, controls, materials and maintenance all matter.",spots:[[23,35,22,22,"wave","Magnets help guide the experiment."],[48,20,24,26,"glow","Sensors help watch the machine."],[74,35,22,27,"bob","Pip lifts the chip puzzle piece."]]},
{title:"Tiny Chips, Big Jobs",text:"Special chips can help control powerful electricity carefully and precisely.",note:"Semiconductors are tiny electronic helpers used in control and power equipment.",spots:[[35,18,36,43,"wave","The magnifier moves across the chip."],[38,34,25,27,"glow","Golden paths connect the helpers."],[55,22,18,20,"bob","The control knob turns one careful step."]]},
{title:"Guiding Big Electricity",text:"Power electronics guide and change large amounts of electricity so machines get what they need.",note:"Power electronics control and convert electrical power; the golden ribbon is a child-friendly metaphor.",spots:[[36,28,24,32,"glow","The main control wakes gently."],[54,28,25,30,"wave","One power path becomes three."],[25,24,23,40,"bob","Dot turns the safe model knob."]]},
{title:"Waves Warm the Plasma",text:"Radio waves may help warm plasma—the super-hot gas inside a fusion experiment.",note:"Radio-frequency systems may transfer energy to plasma. The display is sealed and symbolic.",spots:[[66,22,22,31,"wave","Radio waves travel toward the display."],[39,17,29,37,"glow","The plasma ribbon grows a little brighter."],[13,20,24,32,"bob","Fenn’s picture cards open in order."]]},
{title:"Eyes and Helping Hands",text:"Sensors watch the machine. Robots can help in places that are too hot for people.",note:"Sensors collect information and remote robots can support maintenance in hazardous areas.",spots:[[55,5,30,20,"glow","The three sensors check the machine."],[42,25,25,29,"bob","The robot arm replaces the bolt."],[36,9,55,50,"wave","Everyone watches from behind the window."]]},
{title:"A Plan for More Research",text:"A company and the government wrote a plan to study these special electronics.",note:"The announcement was a letter of intent for proposed research support, not a finished award.",spots:[[15,29,70,38,"wave","The research pictures light up one by one."],[7,56,25,18,"bob","One side adds its mark to the plan."],[68,38,20,25,"glow","The last step is still a question."]]},
{title:"A Plan Is Not a Finish Line",text:"The money is proposed, not all received or spent. Fusion electricity is not ready yet.",note:"A proposed award is not money already spent, and this project has not produced commercial fusion electricity.",spots:[[43,31,42,33,"wave","Only the first research step lights up."],[62,4,28,22,"glow","The power cable still has a gap."],[25,34,23,35,"bob","Pip says, ‘Not yet.’"]]},
{title:"Every Helper Matters",text:"Big ideas need many careful helpers. Ask, build, test, and check—one step at a time.",note:"The ending celebrates careful research, not a completed fusion plant.",spots:[[27,5,21,23,"glow","The chip connects to the power box."],[35,47,22,24,"bob","The robot helper waves."],[45,40,25,31,"wave","The next-test puzzle piece glows."]]}
];
const pages=document.querySelector('#pages'),dots=document.querySelector('#dots'),book=document.querySelector('#book'),label=document.querySelector('#label'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),hints=document.querySelector('#hints'),sound=document.querySelector('#sound'),info=document.querySelector('#info'),notes=document.querySelector('#notes'),live=document.querySelector('#live');let current=0,soundOn=true,audio,touchX=0;
story.forEach((s,i)=>{const page=document.createElement('article');page.className='page'+(i===0?' active':'');page.innerHTML=`<img class="art" src="page-${String(i+1).padStart(2,'0')}/background.png" alt="${s.title}"><i class="ambient a"></i><i class="ambient b"></i><i class="ambient c"></i><i class="burst"></i><div class="toast"></div><div class="copy"><h2>${s.title}</h2><p>${s.text}</p></div>`;s.spots.forEach(([x,y,w,h,kind,name],j)=>{const b=document.createElement('button');b.className='hotspot';b.ariaLabel=name;b.style.cssText=`--x:${x}%;--y:${y}%;--w:${w}%;--h:${h}%`;b.onclick=e=>play(page,b,e,j,kind,name);page.append(b)});pages.append(page);const d=document.createElement('button');d.className='dot'+(i===0?' active':'');d.ariaLabel=`Go to page ${i+1}`;d.onclick=()=>show(i);dots.append(d)});
const pageEls=[...document.querySelectorAll('.page')];
function play(page,button,e,j,kind,name){const burst=page.querySelector('.burst'),toast=page.querySelector('.toast'),r=book.getBoundingClientRect(),b=button.getBoundingClientRect();const px=e.clientX?e.clientX-r.left:b.left+b.width/2-r.left,py=e.clientY?e.clientY-r.top:b.top+b.height/2-r.top;burst.style.left=`${px/r.width*100}%`;burst.style.top=`${py/r.height*100}%`;burst.className=`burst ${kind}`;void burst.offsetWidth;burst.classList.add('play');toast.textContent=name;toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show');tone(350+j*140,kind)}
function tone(f,kind){if(!soundOn)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio||=new A;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=kind==='glow'?'sine':'triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.45,t+.18);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.31)}
function show(n){n=Math.max(0,Math.min(9,n));if(n===current)return;pageEls[current].classList.remove('active');current=n;pageEls[current].classList.add('active');notes.classList.remove('open');info.ariaPressed=false;ui()}
function ui(){label.textContent=`Page ${current+1} of 10`;prev.disabled=current===0;next.textContent=current===9?'↻':'›';next.ariaLabel=current===9?'Read again':'Next page';[...dots.children].forEach((d,i)=>d.classList.toggle('active',i===current));live.textContent=`Page ${current+1}: ${story[current].title}`;notes.innerHTML=`<h3>Page ${current+1} — Grown-up note</h3><p>${story[current].note}</p><p><strong>Try together:</strong></p><ul>${story[current].spots.map(s=>`<li>${s[5]}</li>`).join('')}</ul>`}
prev.onclick=()=>show(current-1);next.onclick=()=>show(current===9?0:current+1);hints.onclick=()=>{const on=!book.classList.contains('show-hints');book.classList.toggle('show-hints',on);hints.ariaPressed=on};sound.onclick=()=>{soundOn=!soundOn;sound.ariaPressed=soundOn;sound.ariaLabel=soundOn?'Turn sounds off':'Turn sounds on'};info.onclick=()=>{const on=!notes.classList.contains('open');notes.classList.toggle('open',on);info.ariaPressed=on};
document.onkeydown=e=>{if(e.key==='ArrowRight')show(current===9?0:current+1);if(e.key==='ArrowLeft')show(current-1);if(e.key==='Escape'){notes.classList.remove('open');info.ariaPressed=false}};book.ontouchstart=e=>touchX=e.changedTouches[0].clientX;book.ontouchend=e=>{const d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>48)show(d<0?(current===9?0:current+1):current-1)};ui();
</script>
</body>
</html>
