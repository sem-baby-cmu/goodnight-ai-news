<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Lullabyte Studio</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0E0C22;--panel:#1A1A2E;--line:#3A3560;--ink:#FFF4DE;--sub:#B9B3D6;--glow:#FFD23F}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 Grandstander,Fredoka,system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1}
a{color:var(--sub)}
main{max-width:1200px;margin:auto;padding:18px 20px 60px}
details{background:var(--panel);border-radius:16px;padding:14px 18px;margin-bottom:16px}
summary{cursor:pointer;font-weight:700}
textarea{width:100%;height:220px;margin-top:12px;padding:12px;border-radius:12px;
  border:2px solid var(--line);background:var(--bg);color:var(--ink);
  font:13px/1.45 ui-monospace,Menlo,monospace}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
button{font:inherit;border:0;border-radius:12px;padding:9px 16px;cursor:pointer;
  background:#2A2650;color:var(--ink)}
button.primary{background:var(--glow);color:#1A1A2E;font-weight:700}
button:disabled{opacity:.5;cursor:wait}
#status{color:var(--sub)}#status.err{color:#F7A6C8}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:18px;
  align-items:center;background:var(--panel);border-radius:16px;padding:10px 16px;
  margin-bottom:16px;box-shadow:0 8px 24px #0005}
.bar .lbl{color:var(--sub);font-size:13px;margin-right:6px}
.seg{display:inline-flex;background:var(--bg);border-radius:12px;padding:3px}
.seg button{background:none;padding:6px 12px;border-radius:9px}
.seg button.on{background:var(--glow);color:#1A1A2E;font-weight:700}
.tag{font-size:12px;color:var(--sub);background:#0E0C22;border-radius:8px;padding:2px 8px}
#empty{color:var(--sub);text-align:center;padding:60px 0}

/* Horizontal: a book spread. Picture left, words right. */
.h{display:grid;grid-template-columns:55% 45%;aspect-ratio:16/9;background:#100E24;
  border-radius:20px;overflow:hidden}
.h .art svg,.v .art svg{width:100%;height:100%;display:block}
.h .words{display:flex;align-items:center;padding:6%;font-size:clamp(18px,2.6vw,34px);
  font-weight:700;line-height:1.45}
.w{transition:color .15s}.w.on{color:var(--glow)}

/* Vertical: the 4:5 feed card for IG and Threads, words baked in. */
.v{display:flex;justify-content:center}
.v .art{width:min(100%,520px);aspect-ratio:4/5;border-radius:16px;overflow:hidden;
  box-shadow:0 16px 50px #0007}

.nav{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:14px}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:#3A3560}
.dots i.on{background:var(--glow)}
#dl{display:none}.vertical #dl{display:flex}
</style></head><body>
<header><h1>🌙 Lullabyte Studio <span class="tag">prototype · ages 5 to 7</span></h1>
<a href="/logout">Log out</a></header>
<main>
<details id="input" open><summary>1. Paste Sally's script (JSON)</summary>
  <textarea id="script" spellcheck="false" placeholder='{"title": "...", "script_5to7": [{"page": 1, "slot": "cover", "tone": "warm", "text": "..."}]}'></textarea>
  <div class="row">
    <button id="sample">Load sample script</button>
    <button id="go" class="primary">Generate storybook</button>
    <span id="status"></span>
  </div>
</details>

<div class="bar" id="bar">
  <div><span class="lbl">Character</span><span class="seg" data-k="character">
    <button data-v="robot" class="on">Robot</button><button data-v="owl">Owl</button></span></div>
  <div><span class="lbl">Voice</span><span class="seg" data-k="voice">
    <button data-v="george" class="on">George</button><button data-v="sarah">Sarah</button>
    <button data-v="lily">Lily</button></span></div>
  <div><span class="lbl">View</span><span class="seg" data-k="view">
    <button data-v="horizontal" class="on">Horizontal</button><button data-v="vertical">Vertical (IG/Threads)</button></span></div>
</div>

<section id="stage"><div id="empty">Paste a script and click <b>Generate storybook</b>.</div></section>
<div class="nav" id="nav" hidden>
  <button id="prev">◀</button>
  <button id="play" class="primary">▶ Play</button>
  <button id="next">▶</button>
  <div class="dots" id="dots"></div>
</div>
<div class="row" id="dl" style="justify-content:center">
  <button id="dl1">Download this card (PNG)</button>
  <button id="dlall">Download all cards</button>
</div>
<audio id="audio" preload="auto"></audio>
</main>

<script>
const $ = s => document.querySelector(s);
const S = {book: null, character: 'robot', voice: 'george', view: 'horizontal',
           page: 0, playing: false, clips: {}, pending: {}};
const audio = $('#audio');

function status(msg, err) { const e = $('#status'); e.textContent = msg || ''; e.className = err ? 'err' : ''; }

async function post(url, body) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'},
                              body: JSON.stringify(body)});
  const d = await r.json().catch(() => ({error: 'Server error ' + r.status}));
  if (r.status === 401) { location.reload(); }
  if (!r.ok) throw new Error(d.error || ('Error ' + r.status));
  return d;
}

$('#sample').onclick = async () => {
  const t = await (await fetch('/sample.json')).text();
  $('#script').value = t;
};

$('#go').onclick = async () => {
  let script;
  try { script = JSON.parse($('#script').value); }
  catch (e) { return status('That is not valid JSON: ' + e.message, true); }
  $('#go').disabled = true; status('Drawing the pages…');
  try {
    S.book = await post('/api/scenes', script);
    S.clips = {}; S.pending = {}; S.page = 0; stop();
    $('#input').open = false;
    render();
    status('');
    loadVoice(S.voice);
  } catch (e) { status(e.message, true); }
  finally { $('#go').disabled = false; }
};

// Voices are made only when picked, so an unused voice costs nothing.
async function loadVoice(v) {
  if (!S.book || S.clips[v] || S.pending[v]) return S.pending[v];
  status(`Making the ${v} voice… (about 10 to 30 seconds)`);
  S.pending[v] = post('/api/voice', {voice: v, texts: S.book.pages.map(p => p.text)})
    .then(d => { S.clips[v] = d.clips; if (v === S.voice) { status(''); render(); } })
    .catch(e => { status(e.message, true); })
    .finally(() => { delete S.pending[v]; });
  return S.pending[v];
}

document.querySelectorAll('.seg').forEach(seg => seg.onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  const k = seg.dataset.k; S[k] = b.dataset.v;
  document.body.classList.toggle('vertical', S.view === 'vertical');
  if (k === 'voice') { const was = S.playing; stop(); loadVoice(S.voice).then(() => was && play()); }
  render();
});

function render() {
  if (!S.book) return;
  const p = S.book.pages[S.page], pic = p[S.character];
  $('#empty')?.remove();
  $('#nav').hidden = false;
  const stage = $('#stage');
  if (S.view === 'horizontal') {
    const words = p.text.trim().split(/ +/).map((w, i) => `<span class="w" data-i="${i}">${esc(w)}</span>`).join(' ');
    stage.innerHTML = `<div class="h"><div class="art">${pic.scene}</div>
      <div class="words"><p>${words}</p></div></div>`;
  } else {
    stage.innerHTML = `<div class="v"><div class="art">${pic.card}</div></div>`;
  }
  $('#dots').innerHTML = S.book.pages.map((_, i) => `<i class="${i === S.page ? 'on' : ''}"></i>`).join('');
  $('#play').textContent = S.playing ? '❚❚ Pause' : '▶ Play';
}

function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function go(i) {
  if (!S.book) return;
  S.page = Math.max(0, Math.min(S.book.pages.length - 1, i));
  render();
  if (S.playing) startClip();
}
$('#prev').onclick = () => go(S.page - 1);
$('#next').onclick = () => go(S.page + 1);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') go(S.page + 1);
  if (e.key === 'ArrowLeft') go(S.page - 1);
});

function stop() { S.playing = false; audio.pause(); render(); }
async function play() {
  if (!S.clips[S.voice]) { await loadVoice(S.voice); if (!S.clips[S.voice]) return; }
  S.playing = true; render(); startClip();
}
function startClip() {
  const c = S.clips[S.voice]?.[S.page];
  if (!c) return;
  audio.src = 'data:audio/mpeg;base64,' + c.audio;
  audio.play().catch(() => stop());
}
$('#play').onclick = () => S.playing ? stop() : play();
audio.onended = () => {
  if (S.page < S.book.pages.length - 1) go(S.page + 1);
  else stop();
};

// Word highlight: light up the last word whose start time has passed.
(function tick() {
  const c = S.playing && S.clips[S.voice]?.[S.page];
  if (c && S.view === 'horizontal') {
    const t = audio.currentTime;
    let on = -1;
    c.words.forEach((w, i) => { if (w && w[0] <= t) on = i; });
    document.querySelectorAll('.w').forEach((el, i) => el.classList.toggle('on', i === on));
  }
  requestAnimationFrame(tick);
})();

// Vertical cards to PNG, 1080 x 1350, ready to post.
function cardPng(i) {
  return new Promise((ok, bad) => {
    const svg = S.book.pages[i][S.character].card
      .replace('<svg ', '<svg width="1080" height="1350" ');
    const url = URL.createObjectURL(new Blob([svg], {type: 'image/svg+xml'}));
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas'); cv.width = 1080; cv.height = 1350;
      cv.getContext('2d').drawImage(img, 0, 0, 1080, 1350);
      URL.revokeObjectURL(url);
      cv.toBlob(b => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = `lullabyte-${S.character}-${String(i + 1).padStart(2, '0')}.png`;
        a.click(); ok();
      }, 'image/png');
    };
    img.onerror = bad; img.src = url;
  });
}
$('#dl1').onclick = () => cardPng(S.page);
$('#dlall').onclick = async () => {
  for (let i = 0; i < S.book.pages.length; i++) { await cardPng(i); await new Promise(r => setTimeout(r, 400)); }
};
</script>
</body></html>
