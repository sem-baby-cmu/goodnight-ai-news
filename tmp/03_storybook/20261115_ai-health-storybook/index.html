<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten-page interactive picture book for young children about asking AI health questions safely.">
<title>Dot Asks Pip About Feeling Tired</title>
<style>
:root{--ink:#4b3024;--cream:#fff3d8;--teal:#087d74;--dark:#07554e;--gold:#ffc43b;--chrome:#18352fdc}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;color:var(--ink);background:radial-gradient(circle at 50% 25%,#50766b,#234b44 55%,#102f2b);font-family:"Avenir Next",Avenir,"Trebuchet MS",system-ui,sans-serif}
button{font:inherit}.reader{position:fixed;inset:0;display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.book{position:relative;width:min(100vw,177.68svh);height:min(100svh,56.28vw);overflow:hidden;background:var(--cream);box-shadow:0 24px 90px #0008;isolation:isolate}
.page{position:absolute;inset:0;visibility:hidden;opacity:0;transform:translateX(2%);transition:opacity .28s,transform .28s,visibility 0s .28s}.page.active{visibility:visible;opacity:1;transform:none;transition-delay:0s}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.copy{position:absolute;z-index:7;left:8%;right:8%;top:76%;bottom:2%;display:grid;place-content:center;text-align:center;pointer-events:none}.copy h2{margin:0 0 .24em;color:var(--dark);font-family:Georgia,serif;font-size:clamp(.85rem,2.1vw,2.15rem);line-height:1.05}.copy p{max-width:980px;margin:0 auto;font-size:clamp(.56rem,1.25vw,1.25rem);font-weight:700;line-height:1.38;text-wrap:balance}
.ambient,.spark{position:absolute;z-index:4;pointer-events:none}.ambient{width:1.1%;aspect-ratio:1;border-radius:50%;background:#fff7;box-shadow:0 0 12px #fff8}.ambient.a{left:17%;top:19%;animation:blink 2.3s steps(4,end) infinite}.ambient.b{left:55%;top:16%;animation:sway 1.8s steps(4,end) infinite}.ambient.c{left:84%;top:40%;animation:pulse 2s steps(4,end) infinite}
@keyframes blink{0%,72%,100%{opacity:0}78%,88%{opacity:1}}@keyframes sway{50%{transform:translateX(7px) rotate(8deg)}}@keyframes pulse{50%{transform:scale(1.6);opacity:.25}}
.hotspot{position:absolute;z-index:6;left:var(--x);top:var(--y);width:var(--w);height:var(--h);padding:0;border:0;border-radius:50%;color:transparent;background:transparent;cursor:pointer}.hotspot:after{content:"";position:absolute;inset:12%;border:3px dashed transparent;border-radius:50%}.show-hints .hotspot:after,.hotspot:focus-visible:after{border-color:#ffffffe8;background:#ffc43b22;box-shadow:0 0 0 4px #07554e33;animation:hint 1.25s steps(4,end) infinite}@keyframes hint{50%{transform:scale(1.07)}}
.spark{left:50%;top:50%;width:9%;aspect-ratio:1;opacity:0;transform:translate(-50%,-50%);border-radius:50%;border:8px dotted #ffd24d;filter:drop-shadow(0 0 5px white)}.spark.play{animation:pop .78s steps(5,end)}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5) rotate(30deg)}}
.topbar,.nav{position:absolute;z-index:20;left:2.2%;right:2.2%;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.topbar{top:2.2%}.nav{bottom:2.2%}.tools,.dots{display:flex;gap:clamp(3px,.55vw,9px);pointer-events:auto}
.pill,.icon,.arrow{border:1px solid #ffffff66;color:white;background:var(--chrome);box-shadow:0 5px 18px #0003;backdrop-filter:blur(8px)}.pill{padding:.48em .85em;border-radius:999px;font-size:clamp(.55rem,1.02vw,.94rem);font-weight:850}.icon,.arrow{display:grid;place-items:center;padding:0;border-radius:50%;cursor:pointer}.icon{width:clamp(31px,3.2vw,45px);aspect-ratio:1;font-weight:900}.icon[aria-pressed=true]{color:#173e39;background:var(--gold)}.arrow{width:clamp(35px,4.1vw,59px);aspect-ratio:1;font-size:clamp(.95rem,1.85vw,1.5rem);pointer-events:auto}.arrow:disabled{opacity:.28;cursor:default}
.dot{width:clamp(5px,.7vw,10px);aspect-ratio:1;padding:0;border:0;border-radius:50%;background:#3b281f55;cursor:pointer}.dot.active{background:var(--teal);transform:scale(1.35)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-aspect-ratio:1/1){.copy{padding-inline:4%}.copy p{line-height:1.25}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="reader" aria-label="Dot Asks Pip About Feeling Tired interactive storybook"><section class="book" id="book">
  <div class="topbar"><div class="pill" id="label">Page 1 of 10</div><div class="tools"><button class="icon" id="hints" aria-pressed="false" aria-label="Show clickable spots">✦</button><button class="icon" id="sound" aria-pressed="true" aria-label="Turn sounds off">♪</button></div></div>
  <div id="pages"></div>
  <nav class="nav" aria-label="Story pages"><button class="arrow" id="prev" aria-label="Previous page">‹</button><div class="dots" id="dots"></div><button class="arrow" id="next" aria-label="Next page">›</button></nav>
  <p class="sr" id="live" aria-live="polite"></p>
</section></main>
<script>
const story=[
  ["A Tired Morning","Dot woke up feeling very tired. “Pip, why do I feel this way?” she asked.",[[30,28,22,32,"Help Dot yawn"],[54,31,22,32,"Let Pip listen"],[83,6,14,23,"Open the curtains"]]],
  ["Ideas Are Not an Exam","Pip knew many possible reasons. But Pip could not look inside Dot’s body or know exactly what was wrong.",[[45,5,20,25,"Tap the moon idea"],[75,11,19,28,"Tap the question"],[52,30,23,33,"Ask Pip"]]],
  ["A New Study Begins","Researchers are studying how adults ask AI about health. They want to learn when its answers help—and when they do not.",[[43,31,19,26,"Move the magnifier"],[53,49,22,21,"Open the notebook"],[21,19,22,38,"Ask Fenn"]]],
  ["Three Careful Questions","Is the answer helpful? Is it easy to understand? Does trusted health information support it?",[[20,50,25,22,"Check helpful"],[43,50,25,22,"Check clear"],[66,50,25,22,"Check trusted"]]],
  ["The Study Just Started","The study is new. No one has proved that AI can safely act like a doctor.",[[85,4,13,22,"Check the result flag"],[46,36,39,30,"Follow the unfinished path"],[17,32,19,30,"Ask Pip to wait"]]],
  ["Tell a Grown-Up","Dot still felt tired. “I will tell a grown-up who can help me,” she said.",[[31,31,21,35,"Let Dot speak"],[53,28,24,40,"Let Fenn listen"],[82,31,13,18,"Light the phone"]]],
  ["A Real Check-Up","Fenn listened, looked, and asked questions. A health professional can check things that Pip cannot.",[[41,35,21,28,"Listen with the stethoscope"],[23,25,22,40,"Ask Fenn"],[78,27,19,39,"Let Pip step back"]]],
  ["Private Means Private","Health information can be personal. A child should ask a trusted adult before sharing it with an AI tool.",[[43,20,20,38,"Lock the box"],[13,30,24,30,"Cover the private card"],[28,48,20,15,"Keep the input closed"]]],
  ["AI Can Help Explain","With Fenn beside her, Dot asked Pip what a health word meant. Pip used simple words and pictures to explain.",[[37,27,25,37,"Explore the picture card"],[42,30,11,29,"Move the thermometer"],[40,60,25,14,"Open the book"]]],
  ["The Safe Rule","AI can explain. Grown-ups can help. When someone may be sick or hurt, ask a health professional.",[[14,5,20,24,"AI can explain"],[38,5,25,24,"Grown-ups can help"],[62,5,25,24,"Health professionals can check"]]]
];
const pages=document.querySelector('#pages'),dots=document.querySelector('#dots'),book=document.querySelector('#book'),label=document.querySelector('#label'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),hints=document.querySelector('#hints'),sound=document.querySelector('#sound'),live=document.querySelector('#live');let current=0,soundOn=true,audio,touchX=0;
story.forEach((s,i)=>{const page=document.createElement('article');page.className='page'+(i===0?' active':'');page.innerHTML=`<img class="art" src="pages/page-${String(i+1).padStart(2,'0')}.png" alt="${s[0]}"><i class="ambient a"></i><i class="ambient b"></i><i class="ambient c"></i><i class="spark"></i><div class="copy"><h2>${s[0]}</h2><p>${s[1]}</p></div>`;s[2].forEach(([x,y,w,h,name],j)=>{const b=document.createElement('button');b.className='hotspot';b.ariaLabel=name;b.style.cssText=`--x:${x}%;--y:${y}%;--w:${w}%;--h:${h}%`;b.onclick=e=>play(page,e,j);page.append(b)});pages.append(page);const d=document.createElement('button');d.className='dot'+(i===0?' active':'');d.ariaLabel=`Go to page ${i+1}`;d.onclick=()=>show(i);dots.append(d)});
const pageEls=[...document.querySelectorAll('.page')];
function play(page,e,j){const s=page.querySelector('.spark'),r=book.getBoundingClientRect();s.style.left=`${(e.clientX-r.left)/r.width*100}%`;s.style.top=`${(e.clientY-r.top)/r.height*100}%`;s.classList.remove('play');void s.offsetWidth;s.classList.add('play');tone(360+j*130)}
function tone(f){if(!soundOn)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio||=new A;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.45,t+.18);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.31)}
function show(n){n=Math.max(0,Math.min(9,n));if(n===current)return;pageEls[current].classList.remove('active');current=n;pageEls[current].classList.add('active');ui()}
function ui(){label.textContent=`Page ${current+1} of 10`;prev.disabled=current===0;next.textContent=current===9?'↻':'›';next.ariaLabel=current===9?'Read again':'Next page';[...dots.children].forEach((d,i)=>d.classList.toggle('active',i===current));live.textContent=`Page ${current+1}: ${story[current][0]}`}
prev.onclick=()=>show(current-1);next.onclick=()=>show(current===9?0:current+1);hints.onclick=()=>{const on=!book.classList.contains('show-hints');book.classList.toggle('show-hints',on);hints.ariaPressed=on};sound.onclick=()=>{soundOn=!soundOn;sound.ariaPressed=soundOn;sound.ariaLabel=soundOn?'Turn sounds off':'Turn sounds on'};
document.onkeydown=e=>{if(e.key==='ArrowRight')show(current===9?0:current+1);if(e.key==='ArrowLeft')show(current-1)};book.ontouchstart=e=>touchX=e.changedTouches[0].clientX;book.ontouchend=e=>{const d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>48)show(d<0?(current===9?0:current+1):current-1)};ui();
</script>
</body>
</html>
