# Check the Worker in app/ on every pull request and push.
# Deploy it to Cloudflare only on a push to main.
# The Cloudflare secrets live in the `production` environment, which only
# the main branch can use.

name: Worker

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/deploy.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    defaults:
      run:
        working-directory: app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npx wrangler deploy
      - name: Health check
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 https://goodnight-ai-news.ioenv.workers.dev/health
