name: Workspace

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @storybook/app build

  # Real-browser tests of packages/scene-runtime (#68, D68-1).
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @storybook/scene-runtime exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @storybook/scene-runtime test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scene-runtime-screenshots
          path: packages/scene-runtime/test/browser/__screenshots__
          if-no-files-found: error

  # Browser tests of the Player (#22): vite dev with the Cloudflare plugin.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @storybook/app exec playwright install --with-deps webkit chromium
      - run: pnpm --filter @storybook/app test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: player-screenshots
          path: apps/storybook/test-results/screenshots/
          if-no-files-found: error
