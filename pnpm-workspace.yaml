packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# Dependencies that may run install scripts.
allowBuilds:
  esbuild: true
  workerd: true

# One version of each tool for the whole workspace.
# Each package.json references these with "catalog:".
catalog:
  typescript: 5.9.3
  vitest: 4.1.12
  "@cloudflare/vitest-plugin": ^1.8.5
  "@cloudflare/vite-plugin": ^1.70.0
  wrangler: 4.165.0
  vite: ^8.3.8
  "@vitejs/plugin-react": ^6.3.0
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  hono: ^4.13.19
  "@types/node": ^22.20.5
  jsdom: 31.0.1

# Written by pnpm: these versions are newer than minimumReleaseAge.
minimumReleaseAgeExclude:
  - "@cloudflare/kv-asset-handler@0.5.1"
  - "@cloudflare/vitest-plugin@1.8.5"
  - "@cloudflare/workers-utils@0.55.0"
  - miniflare@5.20261118.0-beta
  - wrangler@4.165.0
