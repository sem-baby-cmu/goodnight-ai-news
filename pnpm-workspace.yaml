packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# Dependencies that may run install scripts.
allowBuilds:
  esbuild: true
  workerd: true

# One version of each tool for the whole workspace.
# Each package.json references these with "catalog:".
catalog:
  typescript: 5.9.3
  vitest: 4.1.12
  "@cloudflare/vitest-plugin": ^1.8.5
  "@cloudflare/vite-plugin": ^1.70.0
  wrangler: 4.165.0
  vite: ^8.3.8
  "@vitejs/plugin-react": ^6.3.0
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  hono: ^4.13.19
  "@types/node": ^22.20.5
  jsdom: 31.0.1
  "@tanstack/react-router": ^1.170.46
  "@base-ui/react": ^1.9.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.2
  tw-animate-css: ^1.4.0
  shadcn: ^4.23.0
  "@fontsource/baloo-2": ^5.3.0
  tailwindcss: ^4.3.5
  "@tailwindcss/vite": ^4.3.5
  "@testing-library/react": ^16.3.3
  "@testing-library/dom": ^10.4.2
  zod: ^4.6.7
  "@hono/zod-validator": ^0.9.1
  tsx: ^4.23.15
  drizzle-orm: ^0.45.4
  drizzle-kit: ^0.31.11
  uuid: ^14.0.3
  # Exact: #21 relies on byte-identical WebP output for one sharp version.
  sharp: 0.35.5
  svgo: 4.1.0
  # Exact: the WebKit build of the S1 smoke test (#15) is tied to this version.
  "@playwright/test": 1.65.1
  # Exact: Vitest browser mode of packages/scene-runtime (#68). The provider
  # matches the vitest version; playwright matches "@playwright/test".
  "@vitest/browser-playwright": 4.1.12
  playwright: 1.65.1

# Written by pnpm: these versions are newer than minimumReleaseAge.
minimumReleaseAgeExclude:
  - "@cloudflare/kv-asset-handler@0.5.1"
  - "@cloudflare/vitest-plugin@1.8.5"
  - "@cloudflare/workers-utils@0.55.0"
  - miniflare@5.20261118.0-beta
  - wrangler@4.165.0
